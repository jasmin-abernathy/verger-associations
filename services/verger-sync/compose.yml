services:
  verger-sync:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3030
      DATA_DIR: /data
      VERGER_SYNC_TOKEN: ${VERGER_SYNC_TOKEN}
      VERGER_AUTH_DB: /data/authority.sqlite
      VERGER_COOKIE_SECURE: ${VERGER_COOKIE_SECURE:-true}
      VERGER_ALLOWED_ORIGINS: ${VERGER_ALLOWED_ORIGINS:-}
      VERGER_NATIVE_ORIGINS: ${VERGER_NATIVE_ORIGINS:-https://localhost}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3030:3030"
