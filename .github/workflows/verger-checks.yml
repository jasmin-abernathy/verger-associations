name: Verger PWA et consultations
on:
  push:
    branches: [main]
    paths: ['apps/verger-pwa/**', 'services/verger-sync/**', '.github/workflows/verger-checks.yml']
  pull_request:
    paths: ['apps/verger-pwa/**', 'services/verger-sync/**', '.github/workflows/verger-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verger-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/verger-pwa/package-lock.json
            services/verger-sync/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: services/verger-sync
      - run: npm run check
        working-directory: services/verger-sync
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/verger-pwa
      - run: npm run check && npm run build
        working-directory: apps/verger-pwa
