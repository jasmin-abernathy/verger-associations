name: Webxdc CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "xdc-*"
    paths:
      - "apps/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/webxdc-ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/webxdc-ci.yml"
  workflow_dispatch:

concurrency:
  group: webxdc-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v6
      - name: Tester le modèle et la syntaxe
        run: sh scripts/test.sh

  build:
    # Creating and uploading the package is heavier than the test. Do it only
    # when explicitly requested or for a deliberate release tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: test
    uses: jasmin-abernathy/app-build-factory/.github/workflows/webxdc-build.yml@main
    with:
      app_directory: "apps/reunions-decisions"
      package_name: "reunions-decisions"
      artifact_name: "reunions-decisions-xdc"
      retention_days: 7
